# see https://docs.searxng.org/admin/settings/settings.html#settings-use-default-settings
use_default_settings:
  engines:
    # Tor-only (onions) engines: they fail to load without a Tor proxy.
    remove:
      - ahmia
      - torch
server:
  # base_url is defined in the SEARXNG_BASE_URL environment variable (quadlet)
  secret_key: "ultrasecretkey"  # change this!
  # Private 127.0.0.1 instance: no limiter, no KV store (upstream default).
  limiter: false
  image_proxy: true
  method: 'GET'
ui:
  infinite_scroll: true
  theme_args.simple_style: 'dark'
  hotkeys: 'vim'
  static_use_hash: true
