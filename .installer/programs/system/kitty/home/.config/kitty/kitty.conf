# Configs
include $HOME/.config/kitty/conf/fonts.conf
include $HOME/.config/kitty/conf/cursor.conf
include $HOME/.config/kitty/conf/scrollback.conf
include $HOME/.config/kitty/conf/mouse.conf
include $HOME/.config/kitty/conf/performance-tuning.conf
include $HOME/.config/kitty/conf/terminal-bell.conf
include $HOME/.config/kitty/conf/window-layout.conf
include $HOME/.config/kitty/conf/tab-bar.conf
include $HOME/.config/kitty/conf/color-scheme.conf
include $HOME/.config/kitty/conf/advanced.conf
include $HOME/.config/kitty/conf/os-tweaks.conf
include $HOME/.config/kitty/conf/keyboard-shortcuts.conf

# Per-session window decorations (ADR 0130): the default above is `no`, so KDE
# gets KWin's system titlebar + borders and windows stay movable/closable. The
# wl-roots compositors export KITTY_DECORATIONS="hide_window_decorations yes"
# (niri/hypr conf.d/environment) to hide them for tiling; KDE never sets it.
envinclude KITTY_DECORATIONS

# Theme — generated by the Noctalia kitty user-template (ADR 0130): owns all
# terminal color, live-follows the palette on compositors, fixed under KDE.
include themes/noctalia.conf
