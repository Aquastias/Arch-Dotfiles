# Curated pcmanfm-qt config — stow-owned dotfile, skel-seeded by the installer
# (ADR 0100, alongside the niri config.kdl / hyprland.conf). The Noctalia work
# shell is not a file manager, so pcmanfm-qt fills that gap on both niri and
# Hyprland. "Preset C" layout: compact view, double-click, folders first.
# Terminal=kitty makes F4 / right-click "Open Terminal" drop into kitty at the
# current folder; the right-click custom actions live under
# ~/.local/share/file-manager/actions/. Rosé Pine comes free from Noctalia's Qt
# template (qt5ct/qt6ct) — no theme keys here. pcmanfm-qt rewrites this file on
# exit, so this is only the seeded default.
[Behavior]
SingleClick=false
ConfirmDelete=true
ConfirmTrash=true
NoUsbTrash=false

[FolderView]
Mode=compact
SortColumn=name
SortOrder=ascending
SortFolderFirst=true
ShowHidden=false

[Window]
SidePaneMode=places
ShowMenuBar=true
SplitView=false

[System]
Terminal=kitty
Archiver=
FallbackIconThemeName=
