# Noctalia work-shell config — stow-owned dotfile (ADR 0094).
#
# This is the curated look shipped by default for the niri+Noctalia preset. It
# is delivered two ways from ONE source: the installer stows this repo per-user
# at install time, and `stow .` places it on any box. The niri adapter no longer
# seeds Noctalia config into /etc/skel — it only vendors the plugin folders; the
# enabled list below is the declarative mirror of that vendored set (a drift
# guard keeps them in step). Host-bound state (lockscreen widget geometry keyed
# to an output name, captured wallpaper paths) is deliberately excluded so this
# file stays portable across hardware; Noctalia regenerates it on first run.

[audio]
enable_overdrive = true

[bar]
order = [ "default", "bottom" ]

    [bar.bottom]
    center = [ "widget_9" ]
    enabled = true
    end = [
        "indicator_2",
        "mirror",
        "widget_11",
        "wallpaper",
        "privacy",
        "summary_2",
        "status_3",
        "eyecare_widget_2"
    ]
    position = "bottom"
    start = [
        "file-search",
        "gamermode_2",
        "launcher_3",
        "bar_3",
        "widget_7",
        "widget_8"
    ]
    thickness = 25

    [bar.default]
    end = [
        "tray",
        "network",
        "dns-switcher",
        "toggle",
        "notifications",
        "clipboard",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "bluetooth",
        "cat",
        "nightlight",
        "todo",
        "session"
    ]
    start = [
        "launcher",
        "theme_mode",
        "widget",
        "wallpaper",
        "workspaces"
    ]
    thickness = 25

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 25

# Idle behaviors (ADR 0100). Noctalia v5 owns lock + idle natively, so this is
# config-only, zero extra packages, identical on niri and Hyprland. timeouts are
# seconds. lock @5min, monitors off @10min. Suspend @15min routes through a
# self-gating helper so it fires only on a laptop-on-battery — a desktop or a
# laptop on AC is a no-op (keeps this file byte-identical/portable). Noctalia
# respects idle inhibitors, so fullscreen video / audio hold off idle.
[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 900
action = "command"
command = "sh $HOME/.local/bin/noctalia-idle-suspend"
enabled = true

# Lock before suspend/hibernate on logind PrepareForSleep (ADR 0100) — so both
# the idle suspend above and a lid-close/systemctl suspend land on the lock
# screen. Default is already true; set explicitly to document the intent.
[lockscreen]
lock_before_suspend = true

[lockscreen_widgets]
schema_version = 2
widget_order = []

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[nightlight]
enabled = true

[plugin_settings."yocraft/custom-shortcut"]
icon = "palette"
label = "Cycle palette"
onclick_cmd = "sh $HOME/.local/bin/noctalia-cycle-palette"

[plugins]
auto_update = "none"
enabled = [
    "blackbartblues/keymap",
    "whyoolw/sharednd",
    "alexander/screen-toolkit",
    "elijaharch/wl-screen-mirror",
    "yuuto/arch-updater",
    "blackbartblues/audio-switcher",
    "weinguyen/procmon",
    "dotnetrob/cat",
    "nomadcxx/gamer-mode",
    "gustav0ar/drive-health",
    "apex077/eyecare",
    "nightwatch75/file-search",
    "weinguyen/shell-command",
    "cleboost/ssh-launcher",
    "yocraft/custom-shortcut",
    "aristides/udiskie",
    "nightwatch75/todo",
    "kavya-nama/wallpaper-switcher",
    "rxtsel/portctl",
    "alexander/game-launcher",
    "cleboost/hotspot",
    "dunarand/bookmarks",
    "marccvictoria/llamanager",
    "nightwatch75/dns-switcher"
]

[shell]
app_icon_colorize = true
font_family = "Noto Sans"

[theme]
# Default: Catppuccin Mocha with a lavender accent (ADR 0101, superseding 0093's
# Rosé Pine default) via the community palette "Catppuccin Mocha Lavender" — its
# mPrimary #b4befe (lavender) is the accent Noctalia paints everywhere and
# pushes to apps via its templates. Community palettes are fetched from
# api.noctalia.dev and cached, so first boot needs network (like the plugin
# one-shot). `builtin` is Catppuccin too, so a builtin fallback still lands on
# Catppuccin (Mocha in dark mode). This is the SHARED shell config (ADR 0097),
# so the theme is identical on niri and Hyprland.
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Lavender"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [
        "btop",
        "emacs",
        "gtk3",
        "gtk4",
        "hyprland",
        "kitty",
        "niri",
        "qt",
        "umbriel"
    ]

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.bar]
type = "dunarand/bookmarks:bar"

[widget.bar_3]
text = ""
type = "dunarand/bookmarks:bar"

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clock]
capsule = true

[widget.dns-switcher]
color = "secondary"
show_label = false
type = "nightwatch75/dns-switcher:dns-switcher"

[widget.eyecare-widget]
font_scale = 0.69999999999999996
type = "apex077/eyecare:eyecare-widget"

[widget.eyecare_widget_2]
type = "apex077/eyecare:eyecare-widget"

[widget.file-search]
type = "nightwatch75/file-search:file-search"

[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.gamermode_2]
type = "nomadcxx/gamer-mode:gamermode"

[widget.indicator]
type = "rxtsel/portctl:indicator"

[widget.indicator_2]
type = "rxtsel/portctl:indicator"

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.launcher_3]
type = "alexander/game-launcher:launcher"

[widget.media]
font_scale = 0.80000000000000004

[widget.mirror]
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network]
icon_color = "secondary"
show_label = false
show_vpn_label = true

[widget.status]
type = "aristides/udiskie:status"

[widget.status_3]
type = "aristides/udiskie:status"

[widget.summary]
type = "gustav0ar/drive-health:summary"

[widget.summary_2]
type = "gustav0ar/drive-health:summary"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.toggle]
type = "cleboost/hotspot:toggle"

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.widget_11]
type = "alexander/screen-toolkit:widget"

[widget.widget_2]
type = "blackbartblues/audio-switcher:widget"

[widget.widget_3]
type = "blackbartblues/keymap:widget"

[widget.widget_5]
type = "marccvictoria/llamanager:widget"

[widget.widget_6]
type = "weinguyen/procmon:widget"

[widget.widget_7]
type = "blackbartblues/keymap:widget"

[widget.widget_8]
type = "marccvictoria/llamanager:widget"

[widget.widget_9]
capsule = true
icon_only = true
type = "weinguyen/procmon:widget"
