# qt6ct pre-seed for the App Theming Bridge (ADR 0102). Points qt6ct at
# Noctalia's generated `noctalia` color scheme so Qt/KDE apps follow the shell
# palette on first login with no GUI step. qt6ct expands ~ (Qt6CT::resolvePath),
# so this stays portable across users / skel-seeding. Noctalia writes the
# scheme file itself; it is not part of this stow payload.
# style=Fusion so Qt honours the custom palette; icon_theme matches GTK's.
[Appearance]
color_scheme_path=~/.config/qt6ct/colors/noctalia.conf
custom_palette=true
icon_theme=Papirus-Dark
style=Fusion
