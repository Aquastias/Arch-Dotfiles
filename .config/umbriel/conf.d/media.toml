# Hardware media keys (ADR 0096). Mirrors niri/conf.d/media.kdl: the same
# commands, allowed while locked so they work on the lock screen. One
# sub-table per key (TOML inline tables cannot wrap); [keybinds] tables merge
# across includes, so these join keybinds.toml's.

[keybinds.XF86AudioRaiseVolume]
action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0"
allow_when_locked = true

[keybinds.XF86AudioLowerVolume]
action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-"
allow_when_locked = true

[keybinds.XF86AudioMute]
action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
allow_when_locked = true

[keybinds.XF86AudioMicMute]
action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
allow_when_locked = true

[keybinds.XF86MonBrightnessUp]
action = "spawn:brightnessctl --class=backlight set 5%+"
allow_when_locked = true

[keybinds.XF86MonBrightnessDown]
action = "spawn:brightnessctl --class=backlight set 5%-"
allow_when_locked = true

[keybinds.XF86AudioPlay]
action = "spawn:playerctl play-pause"
allow_when_locked = true

[keybinds.XF86AudioPause]
action = "spawn:playerctl play-pause"
allow_when_locked = true

[keybinds.XF86AudioNext]
action = "spawn:playerctl next"
allow_when_locked = true

[keybinds.XF86AudioPrev]
action = "spawn:playerctl previous"
allow_when_locked = true
