# Autostart the shared Noctalia shell (ADR 0097). Mirrors
# niri/conf.d/autostart.kdl, entry for entry. Each entry runs through
# /bin/sh -c, so $HOME expands. Changes need an Umbriel restart.
[general]
autostart = [
  "noctalia",
  # First-login one-shot: enable the vendored plugins once (ADR 0093).
  "$HOME/.local/bin/noctalia-enable-plugins",
  # Live Theme Bridge (ADR 0116): repaint running Qt6/GTK3 apps on a theme
  # change.
  "$HOME/.local/bin/noctalia-theme-bridge",
  # pcmanfm-qt daemon (ADR 0162): owns FileManager1 ("Show in folder").
  "pcmanfm-qt -d",
  # XDG user dirs + ~/Projects (ADR 0131, ADR 0162).
  "$HOME/.local/bin/noctalia-xdg-user-dirs",
  # Reassert the shared gsettings cursor into Bibata (ADR 0123).
  "gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice",
  "gsettings set org.gnome.desktop.interface cursor-size 24",
  # Middle-click paste for GTK (ADR 0147).
  "gsettings set org.gnome.desktop.interface gtk-enable-primary-paste true",
]
